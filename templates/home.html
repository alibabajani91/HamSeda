<html>
    <head>
        <title>HamSeda | Home</title>
        <link rel="stylesheet" href="{{ url_for('static',filename='styles/style.css') }}">
    </head>
    <body>
        <div class="header">
                <a href="/"><button class="header-button"> home </button></a>
                {% if session.get('id') %}
                |
                <a href="/logout"><button class="header-button"> logout </button></a>
                {% else %}
                |
                <a href="/login"><button class="header-button"> login </button></a>
                |
                <a href="/sign_up"><button class="header-button"> sign up </button></a>
                {% endif %}
                |
                <a href="/send_message"><button class="header-button"> send a message </button></a>
        </div>
        <hr>
        <h3 class="message">{{ msg }}</h3>
    </body>
</html>
